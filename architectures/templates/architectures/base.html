
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SystemArct{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'architectures/style.css' %}">
</head>
<body>

    <header class="navbar">
        <a href="{% url 'architectures:library' %}"
           class="brand">
            <span class="brand-icon">S</span>
            <span>System<span class="accent">Arct</span></span>
        </a>

        <nav class="nav-links">
            <a href="#about">Library</a>
            <a href="{% url 'architectures:about' %}">About</a>
            <a href="/reviews">Reviews</a>
        </nav>

        <div class="nav-status">
            <span class="status-dot"></span>
            Architecture Hub
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer" id="about">
        <div class="brand footer-brand">
            System<span class="accent">Arct</span>
        </div>
        <p>
            Explore systems. Understand architecture.
            Build better software.
        </p>
        <p class="copyright">
            © {% now "Y" %} SystemArct
        </p>
    </footer>

</body>
</html>
